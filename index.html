<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VSR GOLD — Stock Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#4A0E8F; --purple-mid:#7B2FBE; --purple-bg:#F9F5FD; --gold:#B8860B; --gold-soft:#D4AF37;
    --ink:#2A1A3D; --muted:#7D6E8C; --line:#E2D9EE; --page:#FDF7FA; --card:#FFFFFF;
    --ok:#1E7A4B; --warn:#B26A00; --err:#C0392B;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--page); color:var(--ink); font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:env(safe-area-inset-top,0) 0 40px; -webkit-tap-highlight-color:transparent;
  }
  .page-frame{
    max-width:756px;margin:18px auto 28px;border:2px solid var(--gold);border-radius:20px;
    background:var(--purple-bg);box-shadow:0 6px 22px rgba(74,14,143,.08);overflow:hidden;
  }
  .wrap{padding:10px 14px 14px}
  .top{padding:20px 18px 16px;background:var(--card);border-bottom:3px solid var(--gold-soft)}
  .brand-row{display:flex;align-items:center;gap:14px}
  .brand-badge{width:48px;height:48px;border-radius:50%;flex:0 0 auto;color:#fff;font-weight:800;font-size:12.5px;
    letter-spacing:.5px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--purple),var(--purple-mid));box-shadow:0 3px 8px rgba(74,14,143,.28)}
  .brand-text{flex:1 1 auto;min-width:0}
  .top h1{font-family:'Playfair Display',Georgia,serif;font-size:22px;letter-spacing:.6px;color:var(--purple);margin:0}
  .brand-sub{margin:2px 0 0;font-size:11px;font-weight:700;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase}
  .brand-stars{margin-left:auto;flex:0 0 auto;display:flex;gap:5px;color:var(--gold-soft);font-size:16px}

  .card{background:var(--card);border:1.5px solid var(--gold);border-radius:14px;margin:14px 0;overflow:hidden}
  .ch{background:var(--purple-bg);border-bottom:1px solid var(--purple);color:var(--purple);font-weight:700;font-size:13px;
      letter-spacing:.8px;text-transform:uppercase;padding:11px 16px}
  .cb{padding:16px}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:#6B5A80;margin-bottom:6px}
  .req{color:var(--purple)}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;font:inherit;font-size:15px;color:var(--ink);background:#FCFAFF;border:1.5px solid var(--line);
    border-radius:10px;padding:11px 12px;outline:none;min-height:44px;
  }
  input:focus,select:focus{border-color:var(--purple-mid);box-shadow:0 0 0 3px rgba(123,47,190,.15)}
  input.bad,select.bad{border-color:var(--err);background:#FFF5F4}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .mb{margin-bottom:14px}
  @media (max-width:520px){ .g3{grid-template-columns:1fr 1fr} .g3 > .span-all{grid-column:1/-1} }

  .tgl{display:flex;border:1.5px solid var(--gold);border-radius:10px;overflow:hidden;background:#FBF8FF}
  .tgl button{flex:1;font:inherit;font-weight:700;font-size:13px;color:#9A8A86;background:transparent;border:0;padding:12px 6px;cursor:pointer;
    border-right:1px solid var(--line)}
  .tgl button:last-child{border-right:0}
  .tgl button.on{background:linear-gradient(135deg,var(--purple),var(--purple-mid));color:#fff}

  .item{background:#fff;border:1.5px solid var(--gold);border-radius:14px;margin:14px 0;overflow:hidden}
  .item.err{border-color:var(--err)}
  .item-hd{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:var(--purple-bg);
    border-bottom:1px solid var(--purple);color:var(--purple);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
  .rm{background:none;border:0;color:var(--err);font:inherit;font-weight:700;font-size:12px;cursor:pointer;padding:4px 8px}
  .item-body{padding:16px}
  .msg{font-size:12px;margin-top:6px;line-height:1.45}
  .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)} .msg.err{color:var(--err)} .msg.info{color:var(--muted)}
  .itemerr{background:#FFF1EF;color:var(--err);font-size:12.5px;font-weight:600;padding:9px 16px;border-bottom:1px solid #F3C9C4}
  .hide{display:none !important}
  .retconf{margin-top:8px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;color:var(--warn);text-transform:none;letter-spacing:0;font-weight:600}
  .retconf input{width:18px;height:18px;margin-top:1px;flex:0 0 auto}

  .phwrap{position:relative}
  .phlbl{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--gold-soft);border-radius:10px;background:var(--purple-bg);
    color:#6B5A80;padding:12px 14px;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;min-height:44px}
  .phwrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
  .phprev{max-width:100%;max-height:150px;border-radius:8px;margin-top:8px;display:none}
  .phprev.show{display:block}
  .phrm{display:none;color:var(--err);font-size:11px;font-weight:700;margin-top:4px;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}

  .add{width:100%;font:inherit;font-weight:700;color:var(--purple);background:var(--purple-bg);border:2px dashed var(--gold-soft);
    border-radius:14px;padding:15px;cursor:pointer;font-size:14px}
  .save{width:100%;font:inherit;font-weight:700;font-size:16px;color:#fff;border:0;border-radius:12px;padding:16px;margin-top:16px;cursor:pointer;
    background:linear-gradient(135deg,var(--purple),var(--purple-mid));letter-spacing:.5px}
  .save:disabled{opacity:.6;cursor:default}
  .clear{width:100%;font:inherit;font-weight:600;font-size:14px;color:var(--purple);background:transparent;border:1.5px solid var(--line);
    border-radius:12px;padding:12px;margin-top:10px;cursor:pointer}
  .banner{border-radius:12px;padding:13px 16px;font-size:14px;font-weight:600;margin:14px 0;display:none}
  .banner.show{display:block}
  .banner.ok{background:#E7F5EE;color:var(--ok);border:1px solid #BFE3D0}
  .banner.err{background:#FFF1EF;color:var(--err);border:1px solid #F3C9C4}
  .banner.info{background:var(--card);color:var(--purple);border:1.5px solid var(--gold-soft)}
  :focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}

  .statusbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);
    padding:8px 2px;font-weight:600}
  .statusbar-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(30,122,75,.15)}
  .statusbar-dot.off{background:var(--err);box-shadow:0 0 0 3px rgba(192,57,43,.15)}
  .statusbar-sep{opacity:.5}
  .statusbar-btn{font:inherit;font-weight:700;font-size:12px;color:var(--purple);background:var(--purple-bg);
    border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer}
  .statusbar-btn.pending{color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-mid));
    border-color:var(--gold-soft)}
</style>
</head>
<body>

<div class="page-frame">

<div class="top">
  <div class="brand-row">
    <div class="brand-badge">VSR</div>
    <div class="brand-text">
      <h1>VSR GOLD</h1>
      <p class="brand-sub">Stock Entry</p>
    </div>
    <div class="brand-stars">★★★</div>
  </div>
</div>

<div class="wrap">
  <div class="statusbar">
    <span class="statusbar-dot" id="connDot"></span>
    <span id="connText">Online</span>
    <span class="statusbar-sep">·</span>
    <button type="button" class="statusbar-btn" id="refreshBtn" title="Reload employee/product/counter lists">🔄 Refresh Lists</button>
    <button type="button" class="statusbar-btn hide" id="syncBtn" title="Send offline-saved entries now">📤 Sync Offline (<span id="pendingCount">0</span>)</button>
  </div>
  <div class="banner info show" id="loadBanner">Loading employees and product list…</div>

  <div class="card">
    <div class="ch">Entry Details</div>
    <div class="cb">
      <div class="mb">
        <label for="emp">Employee Name <span class="req">★</span></label>
        <select id="emp"><option value="">-- Select Employee --</option></select>
      </div>
      <div class="g2 mb">
        <div>
          <label for="date">Date <span class="req">★</span></label>
          <input type="date" id="date">
        </div>
        <div>
          <label>Stock Entry Type <span class="req">★</span></label>
          <div class="tgl" id="tglType">
            <button type="button" data-v="Opening Stock">Opening</button>
            <button type="button" data-v="Receiving Stock">Receiving</button>
          </div>
        </div>
      </div>
      <div class="g2">
        <div>
          <label>Product From <span class="req">★</span></label>
          <div class="tgl" id="tglFrom">
            <button type="button" data-v="Retail" class="on">Retail</button>
            <button type="button" data-v="Main">Main</button>
          </div>
        </div>
        <div id="counterWrap">
          <label for="counter">Counter Name <span class="req">★</span></label>
          <select id="counter"><option value="">-- Select Counter --</option></select>
        </div>
      </div>
      <div class="msg info hide" id="hubNote" style="margin-top:10px">Main = hub stock, so no counter is needed.</div>
    </div>
  </div>

  <div id="items"></div>
  <button class="add" type="button" id="addItem">＋ &nbsp;Add Another Item</button>

  <div class="banner" id="resultBanner"></div>

  <button class="save" type="button" id="saveBtn">★ &nbsp;Save Stock &nbsp;★</button>
  <button class="clear" type="button" id="clearBtn">Clear Items</button>
</div>

</div>

<script>
/* ================= SETTINGS ================= */
// 1) Stock backend Web App URL (new Google account) — ends with /exec
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZR0GpuTCgy2ErrFO4DOyBaN2USByivHUxN1QOeR67mkRM0l_pcmnodBt41KF29Wi0/exec";
// 2) DSR Web App URL — employees + product lists are read from here (same one the portal uses)
const DSR_URL = "https://script.google.com/macros/s/AKfycbw19KcGbJEee6EK4YnznC0xa9inkJl-GOPhywR8xzyzIPY0-SqBHFSEktS_z4tdLZKA/exec";
const TUNCHS = ['750','916','999','585','375'];
/* ============================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LISTS = { gold:[], diamond:[], length:[], bangleSize:[], ringSize:[], diamondClarity:[], diamondColor:[], goldFlags:{}, diaFlags:{}, counterDesigns:{} };
let counters = [];
let seq = 0;
let submitToken = Math.random().toString(36).slice(2,8);   // renewed after every successful save
const LS_LISTS = 'vsrStockLists_v1', LS_META = 'vsrStockMeta_v1', LS_EMP = 'vsrStockLastEmp';
const LS_QUEUE = 'vsrStockOfflineQueue_v1';   // items saved while offline / when the server didn't respond

function hashStr(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return (h>>>0).toString(36)+str.length.toString(36); }
function normTag(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function hasSep(s){ return /[^A-Za-z0-9]/.test(String(s||'').trim()); }
// Product Name / Design are names, so a custom-typed value is normalized the same way the server already
// normalizes its own product list — "gold chain" and "GOLD CHAIN" both become "Gold Chain".
function titleCase(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|[\s/-])([a-z])/g,(m,sep,c)=>sep+c.toUpperCase()); }
function toYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fetchT(url, opts, ms){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms||20000);
  return fetch(url, Object.assign({}, opts, {signal:c.signal})).finally(()=>clearTimeout(t));
}

/* ---------- offline queue (same pattern as the portal's DSR offline queue) ---------- */
function getQueue(){ try{ return JSON.parse(localStorage.getItem(LS_QUEUE)||'[]'); }catch(e){ return []; } }
function saveQueue(q){ try{ localStorage.setItem(LS_QUEUE, JSON.stringify(q)); return true; }catch(e){ return false; } }

function updateConnStatus(){
  const online = navigator.onLine;
  const dot = $('connDot'), txt = $('connText'), syncBtn = $('syncBtn'), cnt = $('pendingCount');
  dot.classList.toggle('off', !online);
  txt.textContent = online ? 'Online' : 'Offline';
  const pending = getQueue().length;
  cnt.textContent = pending;
  syncBtn.classList.toggle('hide', pending===0);
  syncBtn.classList.toggle('pending', pending>0 && online);
  syncBtn.title = online ? 'Send offline-saved entries now' : 'Will auto-sync once back online';
}

// Saves this submission on the device instead of the server, for a genuine network problem (offline, or
// the server didn't answer in time) — never for a real rejection (duplicate tag, sold tag, validation
// error), which always needs the person's attention right away instead of being queued silently.
function queueOffline(payload, header){
  const q = getQueue();
  q.push({ payload, savedAt: Date.now() });
  const saved = saveQueue(q);
  updateConnStatus();
  if(!saved){
    showBanner('err','Could not save offline — this device\'s storage is full. Please connect to the internet and tap Save again now, or Sync older offline items first.');
    return false;
  }
  submitToken = Math.random().toString(36).slice(2,8);
  $('items').innerHTML=''; addItem();
  showBanner('info','📴 No response from server — saved on this device instead (' + header.entryType + ', ' + (header.productFrom==='Main'?'Main Hub':header.counter) + '). It will sync automatically once online, or tap Sync Offline above.');
  return true;
}

let __stockFlushInFlight = false;
async function flushOfflineQueue(silent){
  if(!navigator.onLine) return;
  if(__stockFlushInFlight) return;
  __stockFlushInFlight = true;
  try{
    const q = getQueue();
    if(!q.length){ updateConnStatus(); return; }
    saveQueue([]);   // claim before sending, so a second trigger (online event + Sync tap) can't resend the same items
    const remaining = [];
    let synced = 0;
    for(const item of q){
      try{
        const res = await fetchT(SCRIPT_URL, {method:'POST', body: JSON.stringify(item.payload)}, 60000).then(r=>r.json());
        if(res && res.ok) synced++;
        else remaining.push(item);
      }catch(e){ remaining.push(item); }
    }
    const stillQueued = getQueue();
    saveQueue(remaining.concat(stillQueued));
    updateConnStatus();
    if(synced>0) showBanner('ok', '✅ ' + synced + ' offline item(s) synced.' + (remaining.length? ' ' + remaining.length + ' still pending (will retry).' : ''));
    else if(remaining.length && !silent) showBanner('err', remaining.length + ' offline item(s) could not sync yet — will retry automatically.');
  } finally {
    __stockFlushInFlight = false;
  }
}
window.addEventListener('online', ()=>{ updateConnStatus(); flushOfflineQueue(); });
window.addEventListener('offline', updateConnStatus);
$('syncBtn').addEventListener('click', ()=>{
  if(!navigator.onLine){ showBanner('err','Still offline — connect to the internet first.'); return; }
  flushOfflineQueue(false);
});
$('refreshBtn').addEventListener('click', ()=>{
  $('loadBanner').className='banner info show'; $('loadBanner').textContent='Refreshing employee / product / counter lists…';
  loadData();
});

/* ---------- toggles ---------- */
function bindToggle(el, onChange){
  el.addEventListener('click', ev=>{
    const b = ev.target.closest('button'); if(!b) return;
    el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(onChange) onChange(b.dataset.v);
  });
}
function togVal(el){ const b = el.querySelector('button.on'); return b ? b.dataset.v : ''; }

/* ---------- header ---------- */
$('date').value = toYMD(new Date());
bindToggle($('tglType'));
bindToggle($('tglFrom'), v=>{
  $('counterWrap').classList.toggle('hide', v==='Main');
  $('hubNote').classList.toggle('hide', v!=='Main');
  refreshAllDesigns();
});
$('counter').addEventListener('change', refreshAllDesigns);
$('emp').addEventListener('change', ()=>{ try{ localStorage.setItem(LS_EMP, $('emp').value); }catch(e){} });

function fillEmployees(list){
  const sel = $('emp'); const prev = sel.value || (function(){ try{return localStorage.getItem(LS_EMP)||'';}catch(e){return '';} })();
  sel.innerHTML = '<option value="">-- Select Employee --</option>' +
    list.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option>${esc(e.name)}</option>`).join('');
  if(prev) sel.value = prev;
}
function fillCounters(list){
  counters = list || [];
  const sel = $('counter'); const prev = sel.value;
  sel.innerHTML = '<option value="">-- Select Counter --</option>' + counters.map(c=>`<option>${esc(c)}</option>`).join('');
  if(prev) sel.value = prev;
}

/* ---------- data loading (cache first, then network) ---------- */
function applyLists(p){
  LISTS.gold = p.gold||[]; LISTS.diamond = p.diamond||[];
  LISTS.length = p.length||[]; LISTS.bangleSize = p.bangleSize||[]; LISTS.ringSize = p.ringSize||[];
  LISTS.diamondClarity = p.diamondClarity||[]; LISTS.diamondColor = p.diamondColor||[];
  LISTS.goldFlags = p.goldFlags||{}; LISTS.diaFlags = p.diaFlags||{};
  LISTS.counterDesigns = p.counterDesigns||{};
  document.querySelectorAll('.item').forEach(refreshItemLists);
}
async function loadData(){
  let hadCache = false;
  try{
    const c = JSON.parse(localStorage.getItem(LS_LISTS)||'null');
    if(c){ fillEmployees(c.employees||[]); applyLists(c.products||{}); hadCache = true; }
    const m = JSON.parse(localStorage.getItem(LS_META)||'null');
    if(m) fillCounters(m.counters);
  }catch(e){}
  const banner = $('loadBanner');
  // v-fix: DSR (employees/products) and Stock (counters) are fetched independently now — earlier both were
  // bundled in one Promise.all, so if EITHER call was slow/failed, counters silently kept showing the old
  // cached list (e.g. a newly added counter never appeared) even though the Stock call itself had succeeded.
  const dsrPromise = fetchT(DSR_URL+'?action=getData', {}, 25000).then(r=>r.json())
    .then(d=>{
      fillEmployees(d.employees||[]);
      applyLists(d.products||{});
      try{ localStorage.setItem(LS_LISTS, JSON.stringify({employees:d.employees||[], products:d.products||{}})); }catch(e){}
      return true;
    }).catch(()=>false);
  const metaPromise = SCRIPT_URL.indexOf('PASTE')===-1
    ? fetchT(SCRIPT_URL+'?action=meta', {}, 25000).then(r=>r.json())
        .then(m=>{
          if(m && m.ok){ fillCounters(m.counters); try{ localStorage.setItem(LS_META, JSON.stringify({counters:m.counters})); }catch(e){} }
          return !!(m && m.ok);
        }).catch(()=>false)
    : Promise.resolve(false);
  const [dsrOk, metaOk] = await Promise.all([dsrPromise, metaPromise]);
  if(SCRIPT_URL.indexOf('PASTE')!==-1){ showBanner('err','Set SCRIPT_URL in this file (stock Web App URL) before saving.'); }
  else if(dsrOk && metaOk){ banner.classList.remove('show'); }
  else if(hadCache){ banner.textContent = 'Offline or slow connection — showing saved lists from last time.'; setTimeout(()=>banner.classList.remove('show'),3000); }
  else { banner.className='banner err show'; banner.textContent = 'Could not load employees / product list. Check internet and reload.'; }
}

/* ---------- items ---------- */
function optList(arr, other){
  return '<option value="">-- Select --</option>' + arr.map(x=>`<option>${esc(x)}</option>`).join('') +
    (other ? '<option value="__other">Other (type manually)</option>' : '');
}
function addItem(){
  seq++;
  const n = seq;
  const div = document.createElement('div');
  div.className = 'item'; div.dataset.n = n;
  div.innerHTML = `
    <div class="item-hd"><span class="ttl">Item</span><button type="button" class="rm">✕ Remove</button></div>
    <div class="itemerr hide"></div>
    <div class="item-body">
      <div class="g2 mb">
        <div><label>Type <span class="req">★</span></label>
          <div class="tgl" data-r="type"><button type="button" data-v="Gold" class="on">Gold</button><button type="button" data-v="Diamond">Diamond</button></div></div>
        <div><label>Tag Status</label>
          <div class="tgl" data-r="tagst"><button type="button" data-v="Tag" class="on">Tag</button><button type="button" data-v="Non Tag">Non Tag</button></div></div>
      </div>

      <div class="mb" data-r="tagWrap">
        <label>Tag No <span class="req">★</span></label>
        <input type="text" data-k="tagNo" placeholder="e.g. BOM2154" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase">
        <div class="msg info" data-r="tagMsg"></div>
        <label class="retconf hide" data-r="retWrap"><input type="checkbox" data-r="retChk"><span>Yes — this tag came back from a sale. Add it to stock again (Return).</span></label>
      </div>
      <div class="mb hide" data-r="qtyWrap">
        <label>Quantity (pcs) <span class="req">★</span></label>
        <input type="number" data-k="qty" inputmode="numeric" min="1" step="1" value="1">
      </div>

      <div class="mb">
        <label>Product Name <span class="req">★</span></label>
        <select data-k="productName"></select>
        <input type="text" data-k="productCustom" class="hide" placeholder="Enter product name" style="margin-top:8px">
      </div>

      <div class="g3 mb hide" data-r="sizeRow">
        <div data-r="bangleWrap" class="hide"><label>Bangle Size <span class="req">★</span></label>
          <select data-k="bangleSize"></select><input type="text" data-k="bangleSizeCustom" class="hide" placeholder="Type size" style="margin-top:8px"></div>
        <div data-r="ringWrap" class="hide"><label>Ring Size <span class="req">★</span></label>
          <select data-k="ringSize"></select><input type="text" data-k="ringSizeCustom" class="hide" placeholder="Type size" style="margin-top:8px"></div>
        <div data-r="lengthWrap" class="hide"><label>Length <span class="req">★</span></label>
          <select data-k="length"></select><input type="text" data-k="lengthCustom" class="hide" placeholder="Type length" style="margin-top:8px"></div>
      </div>

      <div data-r="goldBox">
        <div class="g3 mb">
          <div><label>Design <span class="req">★</span></label><select data-k="design"></select>
            <input type="text" data-k="designCustom" class="hide" placeholder="Enter design name" style="margin-top:8px"></div>
          <div><label>Tunch <span class="req">★</span></label>
            <select data-k="tunch"><option value="">-- Select --</option>${TUNCHS.map(t=>`<option>${t}</option>`).join('')}</select></div>
          <div><label data-r="wtLbl">Weight (gm) <span class="req">★</span></label><input type="text" inputmode="decimal" data-k="weight" placeholder="e.g. 21.37"></div>
        </div>
      </div>

      <div class="hide" data-r="diaBox">
        <div class="g2 mb">
          <div><label>Gross Wt (gm) <span class="req">★</span></label><input type="text" inputmode="decimal" data-k="gross" placeholder="e.g. 6.10"></div>
          <div><label>Net Wt (gm) <span class="req">★</span></label><input type="text" inputmode="decimal" data-k="net" placeholder="e.g. 5.20"></div>
        </div>
        <div class="g2 mb">
          <div><label>Gold Tunch</label><select data-k="diaTunch"><option value="">-- Select --</option>${TUNCHS.map(t=>`<option>${t}</option>`).join('')}</select></div>
          <div><label>Carat</label><input type="text" data-k="carat" placeholder="e.g. 0.50ct"></div>
        </div>
        <div class="g2 mb">
          <div><label>Clarity</label><select data-k="clarity"></select></div>
          <div><label>Color</label><select data-k="color"></select></div>
        </div>
        <div class="mb"><label>Certificate No</label><input type="text" data-k="certNo" placeholder="e.g. GIA-1234567"></div>
      </div>

      <div>
        <label>Photo</label>
        <div class="phwrap">
          <div class="phlbl"><span>📷</span><span data-r="phTxt">Upload Photo</span></div>
          <input type="file" accept="image/*" data-r="file">
        </div>
        <img class="phprev" data-r="prev" alt="">
        <button type="button" class="phrm" data-r="phRm">✕ Remove Photo</button>
      </div>
    </div>`;
  $('items').appendChild(div);
  wireItem(div);
  refreshItemLists(div);
  renumber();
  return div;
}
const R = (b, r) => b.querySelector(`[data-r="${r}"]`);
const K = (b, k) => b.querySelector(`[data-k="${k}"]`);

function wireItem(b){
  bindToggle(R(b,'type'), v=>{
    R(b,'goldBox').classList.toggle('hide', v!=='Gold');
    R(b,'diaBox').classList.toggle('hide', v!=='Diamond');
    refreshItemLists(b);
    updateSizeRows(b);
  });
  bindToggle(R(b,'tagst'), v=>{
    R(b,'tagWrap').classList.toggle('hide', v!=='Tag');
    R(b,'qtyWrap').classList.toggle('hide', v==='Tag');
    R(b,'wtLbl').innerHTML = (v==='Tag' ? 'Weight (gm)' : 'Total weight (gm)') + ' <span class="req">★</span>';
    if(v!=='Tag'){ setTagMsg(b,'info',''); R(b,'retWrap').classList.add('hide'); }
  });
  b.querySelector('.rm').addEventListener('click', ()=>{ b.remove(); renumber(); });
  K(b,'productName').addEventListener('change', ()=>{
    K(b,'productCustom').classList.toggle('hide', K(b,'productName').value!=='__other');
    updateSizeRows(b);
  });
  K(b,'productCustom').addEventListener('input', ()=>updateSizeRows(b));
  ['bangleSize','ringSize','length','design'].forEach(k=>{
    K(b,k).addEventListener('change', ()=>K(b,k+'Custom').classList.toggle('hide', K(b,k).value!=='__other'));
  });
  const tag = K(b,'tagNo');
  tag.addEventListener('input', ()=>{
    b._lk = (b._lk||0)+1; R(b,'retWrap').classList.add('hide'); b._tagState = '';
    tag.classList.remove('bad');
    if(hasSep(tag.value)){ setTagMsg(b,'err','Space, - or / not allowed. Enter like BOM2154.'); tag.classList.add('bad'); b._tagState='sep'; }
    else setTagMsg(b,'info','');
  });
  tag.addEventListener('change', ()=>checkTag(b));
  tag.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tag.blur(); } });
  // photo
  R(b,'file').addEventListener('change', ev=>loadPhoto(b, ev.target));
  R(b,'phRm').addEventListener('click', ()=>clearPhoto(b));
}

function renumber(){
  const all = document.querySelectorAll('.item');
  all.forEach((b,i)=>{
    b.querySelector('.ttl').textContent = 'Item Entry ' + (i+1);
    b.querySelector('.rm').style.visibility = all.length>1 ? 'visible' : 'hidden';
  });
}
function refreshItemLists(b){
  const type = togVal(R(b,'type'));
  const pn = K(b,'productName'); const prev = pn.value;
  pn.innerHTML = optList(type==='Diamond' ? LISTS.diamond : LISTS.gold, true);
  if(prev) pn.value = prev;
  const keep = (sel, html)=>{ const p = sel.value; sel.innerHTML = html; if(p) sel.value = p; };
  keep(K(b,'bangleSize'), optList(LISTS.bangleSize, true));
  keep(K(b,'ringSize'),   optList(LISTS.ringSize, true));
  keep(K(b,'length'),     optList(LISTS.length, true));
  keep(K(b,'clarity'),    optList(LISTS.diamondClarity, false));
  keep(K(b,'color'),      optList(LISTS.diamondColor, false));
  refreshItemDesign(b);
}
// Design options depend on the COUNTER picked at the top (not per-item, not per-product) — every Gold
// item in this batch shares the same counter, so the same design list. Main (hub, no counter) shows every
// counter's designs combined, since hub stock isn't tied to one counter yet.
function currentDesignList(){
  if(togVal($('tglFrom')) !== 'Main'){
    const c = $('counter').value;
    return c ? (LISTS.counterDesigns[c]||[]) : [];
  }
  const seen = {}, out = [];
  Object.keys(LISTS.counterDesigns).forEach(c=>(LISTS.counterDesigns[c]||[]).forEach(d=>{ if(!seen[d]){ seen[d]=1; out.push(d); } }));
  return out;
}
function refreshItemDesign(b){
  const sel = K(b,'design'); if(!sel) return;
  const prev = sel.value;
  sel.innerHTML = optList(currentDesignList(), true);
  if(prev) sel.value = prev;
  K(b,'designCustom').classList.toggle('hide', sel.value!=='__other');
}
function refreshAllDesigns(){ document.querySelectorAll('.item').forEach(refreshItemDesign); }
function productNameOf(b){
  const v = K(b,'productName').value;
  return v==='__other' ? titleCase(K(b,'productCustom').value) : v;
}
// Looks up whether the selected product needs Length / Bangle Size / Ring Size — read straight from the
// Products sheet (goldFlags / diaFlags, keyed by exact product name), never guessed from the name text.
// A custom-typed ("Other") product name has no row in the sheet, so it never shows these extra fields.
function sizeFlagsOf(b){
  const type = togVal(R(b,'type'));
  const table = type==='Diamond' ? LISTS.diaFlags : LISTS.goldFlags;
  const sel = K(b,'productName').value;
  return (sel && sel!=='__other' && table[sel]) ? table[sel] : {length:false, bangle:false, ring:false};
}
function updateSizeRows(b){
  const f = sizeFlagsOf(b);
  R(b,'bangleWrap').classList.toggle('hide', !f.bangle);
  R(b,'ringWrap').classList.toggle('hide', !f.ring);
  R(b,'lengthWrap').classList.toggle('hide', !f.length);
  R(b,'sizeRow').classList.toggle('hide', !(f.bangle||f.ring||f.length));
}
function pickVal(b, k){
  const s = K(b,k); if(!s) return '';
  return s.value==='__other' ? K(b,k+'Custom').value.trim() : s.value;
}

/* ---------- tag check against stock ---------- */
function setTagMsg(b, cls, txt){ const m = R(b,'tagMsg'); m.className = 'msg ' + cls; m.textContent = txt; }
function tagUsedElsewhere(b, tagN){
  return [...document.querySelectorAll('.item')].some(o=>o!==b && togVal(R(o,'tagst'))==='Tag' && normTag(K(o,'tagNo').value)===tagN);
}
async function checkTag(b){
  const inp = K(b,'tagNo'); const raw = inp.value.trim();
  R(b,'retWrap').classList.add('hide'); R(b,'retChk').checked = false; b._tagState = '';
  if(!raw){ setTagMsg(b,'info',''); return; }
  if(hasSep(raw)){ setTagMsg(b,'err','Space, - or / not allowed. Enter like BOM2154.'); inp.classList.add('bad'); b._tagState='sep'; return; }
  inp.value = raw.toUpperCase(); inp.classList.remove('bad');
  const tagN = normTag(raw);
  if(tagUsedElsewhere(b, tagN)){ setTagMsg(b,'err','Duplicate: this tag is already entered in another item below/above.'); inp.classList.add('bad'); b._tagState='dup'; return; }
  if(SCRIPT_URL.indexOf('PASTE')!==-1){ setTagMsg(b,'info',''); return; }
  const my = b._lk = (b._lk||0)+1;
  setTagMsg(b,'info','Checking stock…');
  try{
    const r = await fetchT(SCRIPT_URL+'?action=lookup&tag='+encodeURIComponent(tagN), {}, 20000).then(x=>x.json());
    if(my !== b._lk) return;
    if(r.status==='instock'){
      setTagMsg(b,'err','Duplicate: already in stock' + (r.item && r.item.counter ? ' ('+r.item.counter+')' : '') + '.');
      inp.classList.add('bad'); b._tagState='dup';
    } else if(r.status==='sold'){
      setTagMsg(b,'warn','Sold in DSR ' + (r.sold.dsrId||'') + (r.sold.soldDate ? ' on ' + r.sold.soldDate : '') + '.');
      R(b,'retWrap').classList.remove('hide'); b._tagState='sold';
    } else {
      setTagMsg(b,'ok','New tag — OK.');
    }
  }catch(e){
    if(my === b._lk) setTagMsg(b,'info','Could not check stock right now. It will be checked again on save.');
  }
}

/* ---------- photo ---------- */
function loadPhoto(b, inp){
  const f = inp.files[0]; if(!f) return;
  R(b,'phTxt').textContent = 'Processing…';
  const rd = new FileReader();
  rd.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const M = 800; let w = img.width, h = img.height;
      if(w>M){ h = Math.round(h*M/w); w = M; } if(h>M){ w = Math.round(w*M/h); h = M; }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let q = 0.65, b64 = cv.toDataURL('image/jpeg', q);
      let kb = Math.round(b64.length*0.75/1024);
      if(kb>200){ q = Math.max(0.3, q*(200/kb)*0.9); b64 = cv.toDataURL('image/jpeg', q); kb = Math.round(b64.length*0.75/1024); }
      b._photo = b64;
      R(b,'phTxt').textContent = f.name + ' (' + kb + ' KB)';
      const pv = R(b,'prev'); pv.src = b64; pv.classList.add('show');
      R(b,'phRm').style.display = 'inline-block';
    };
    img.src = ev.target.result;
  };
  rd.readAsDataURL(f);
}
function clearPhoto(b){
  b._photo = ''; R(b,'file').value = ''; R(b,'phTxt').textContent = 'Upload Photo';
  const pv = R(b,'prev'); pv.src=''; pv.classList.remove('show'); R(b,'phRm').style.display = 'none';
}

/* ---------- collect + save ---------- */
function showBanner(cls, txt){
  const el = $('resultBanner'); el.className = 'banner show ' + cls; el.textContent = txt;
  el.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function itemError(b, msg){
  const e = b.querySelector('.itemerr'); b.classList.toggle('err', !!msg);
  e.textContent = msg||''; e.classList.toggle('hide', !msg);
}
function clearItemErrors(){ document.querySelectorAll('.item').forEach(b=>itemError(b,'')); }

function collect(){
  const errs = []; const rows = []; const confirmReturn = [];
  const header = {
    enteredBy: $('emp').value, entryDate: $('date').value, entryType: togVal($('tglType')),
    productFrom: togVal($('tglFrom')), counter: $('counter').value
  };
  let hErr = '';
  if(!header.enteredBy) hErr = 'Select Employee Name.';
  else if(!header.entryDate) hErr = 'Select Date.';
  else if(!header.entryType) hErr = 'Select Stock Entry Type (Opening / Receiving).';
  else if(header.productFrom==='Retail' && !header.counter) hErr = 'Select Counter Name.';
  if(hErr) return {header, hErr};

  const tagsSeen = {};
  document.querySelectorAll('.item').forEach((b,i)=>{
    const type = togVal(R(b,'type')), isTag = togVal(R(b,'tagst'))==='Tag';
    const e = m => errs.push({b, m});
    const pn = productNameOf(b);
    if(!pn) return e('Select / enter Product Name.');
    let tagNo = '';
    if(isTag){
      tagNo = K(b,'tagNo').value.trim();
      if(!tagNo) return e('Enter Tag No.');
      if(hasSep(tagNo)) return e('Tag No: space, - or / not allowed. Enter like BOM2154.');
      const tn = normTag(tagNo);
      if(tagsSeen[tn]) return e('Duplicate: this tag is entered twice in this form.');
      tagsSeen[tn] = 1;
      if(b._tagState==='dup') return e('Duplicate tag — already in stock.');
      if(b._tagState==='sold'){
        if(R(b,'retChk').checked) confirmReturn.push(tn);
        else return e('This tag is sold. Tick "Add it to stock again (Return)" or correct the tag.');
      }
    } else {
      const q = parseInt(K(b,'qty').value,10);
      if(!q || q<1) return e('Quantity must be 1 or more.');
    }
    const sf = sizeFlagsOf(b);
    if(sf.bangle && !pickVal(b,'bangleSize')) return e('Select Bangle Size.');
    if(sf.ring   && !pickVal(b,'ringSize'))   return e('Select Ring Size.');
    if(sf.length && !pickVal(b,'length'))     return e('Select Length.');
    const row = { type, tagStatus: isTag?'Tag':'Non Tag', tagNo, qty: isTag?1:parseInt(K(b,'qty').value,10), productName: pn,
      bangleSize: sf.bangle?pickVal(b,'bangleSize'):'', ringSize: sf.ring?pickVal(b,'ringSize'):'',
      length: sf.length?pickVal(b,'length'):'', photo: b._photo||'' };
    if(type==='Gold'){
      row.design = titleCase(pickVal(b,'design')); row.tunch = K(b,'tunch').value; row.weight = K(b,'weight').value.trim();
      if(!row.design) return e('Select / enter Design.');
      if(!row.tunch) return e('Select Tunch.');
      if(!(parseFloat(row.weight)>0)) return e('Enter Weight.');
    } else {
      row.gross = K(b,'gross').value.trim(); row.net = K(b,'net').value.trim(); row.tunch = K(b,'diaTunch').value;
      row.carat = K(b,'carat').value.trim(); row.clarity = K(b,'clarity').value; row.color = K(b,'color').value; row.certNo = K(b,'certNo').value.trim();
      if(!(parseFloat(row.gross)>0)) return e('Enter Gross Wt.');
      if(!(parseFloat(row.net)>0)) return e('Enter Net Wt.');
      if(parseFloat(row.net)>parseFloat(row.gross)) return e('Net Wt cannot be more than Gross Wt.');
    }
    rows.push({row, b});
  });
  return {header, errs, rows, confirmReturn};
}

$('addItem').addEventListener('click', ()=>{ const d = addItem(); d.scrollIntoView({block:'center', behavior:'smooth'}); });
$('clearBtn').addEventListener('click', ()=>{
  if([...document.querySelectorAll('.item')].some(b=>K(b,'tagNo').value||K(b,'weight').value||K(b,'gross').value||K(b,'design').value||K(b,'designCustom').value)
     && !confirm('Clear all entered items?')) return;
  $('items').innerHTML=''; addItem(); $('resultBanner').className='banner';
});

$('saveBtn').addEventListener('click', async ()=>{
  $('resultBanner').className = 'banner'; clearItemErrors();
  if(SCRIPT_URL.indexOf('PASTE')!==-1){ showBanner('err','Set SCRIPT_URL in this file first (stock Web App URL).'); return; }
  const c = collect();
  if(c.hErr){ showBanner('err', c.hErr); return; }
  if(c.errs.length){
    c.errs.forEach(x=>itemError(x.b, x.m));
    showBanner('err', 'Please fix the highlighted item(s).');
    c.errs[0].b.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  if(!c.rows.length){ showBanner('err','Add at least one item.'); return; }

  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  // same content => same idemKey, so tapping Save again after a lost response can never double-save
  const base = Object.assign({ action:'saveStock', rows: c.rows.map(x=>x.row), confirmReturn: c.confirmReturn }, c.header);
  const payload = Object.assign({ idemKey: 'k' + submitToken + hashStr(JSON.stringify(base)) }, base);
  if(!navigator.onLine){
    queueOffline(payload, c.header);
    btn.disabled = false; btn.textContent = '★  Save Stock  ★';
    return;
  }
  try{
    const res = await fetchT(SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) }, 90000).then(r=>r.json());
    if(res.ok){
      submitToken = Math.random().toString(36).slice(2,8);
      $('items').innerHTML=''; addItem();
      showBanner('ok', 'Saved ' + res.saved + (res.saved===1?' item':' items') + ' to ' + (c.header.productFrom==='Main' ? 'Main Hub' : c.header.counter) + '.');
    } else if(res.errors && res.errors.length){
      res.errors.forEach(er=>{ const b = c.rows[er.index] && c.rows[er.index].b; if(b) itemError(b, er.message); });
      showBanner('err','Nothing was saved. Fix the highlighted item(s) and save again.');
      const first = c.rows[res.errors[0].index]; if(first) first.b.scrollIntoView({block:'center', behavior:'smooth'});
    } else {
      showBanner('err', res.error || 'Save failed. Nothing was saved.');
    }
  }catch(e){
    // Real network failure (offline mid-request, timeout, server unreachable) — never a validation
    // rejection, those are handled above via res.errors. Safe to queue: idemKey means even if the
    // original request secretly DID reach the server, replaying it later can't create a duplicate.
    queueOffline(payload, c.header);
  }finally{
    btn.disabled = false; btn.textContent = '★  Save Stock  ★';
  }
});

updateConnStatus();
addItem();
loadData().then(()=>flushOfflineQueue(true));
</script>
