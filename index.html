  fromSel.value = keepFrom; toSel.value = keepTo;
  // v-add (BRO: "wt kuda ivu... adi click cheste from and to wt box lu ravali" — Overview's own Weight
  // Range filter, same fixed 0–100 list as the Photos tab's).
  const ovFromSel = document.getElementById('ovWtFrom'), ovToSel = document.getElementById('ovWtTo');
  if (ovFromSel && ovToSel) { ovFromSel.innerHTML = WT_RANGE_OPTIONS_HTML; ovToSel.innerHTML = WT_RANGE_OPTIONS_HTML; }
}
function toggleWtRange() {
  const on = document.getElementById('phWtRangeOn').checked;
  document.getElementById('phWtRangeBox').style.display = on ? 'grid' : 'none';
  applyFiltersAndRender();
}
function toggleOvWtRange() {
  const on = document.getElementById('ovWtRangeOn').checked;
  document.getElementById('ovWtRangeBox').style.display = on ? 'grid' : 'none';
  ovLoadDetail();
}
function reloadProductOptions() {
  const sel = document.getElementById('phProduct'); if (!sel) return;
  const keep = sel.value;
  const status = document.getElementById('phStatus').value, counter = document.getElementById('phCounter').value;
  const products = uniqSorted(scopeItems(status, counter, '').map(r => r.productName));
  sel.innerHTML = '<option value="">All</option>' + products.map(p => `<option${p === keep ? ' selected' : ''}>${escHtml(p)}</option>`).join('');
  reloadDimFilters();
}
function reloadDimFilters() {
  const status = document.getElementById('phStatus').value, counter = document.getElementById('phCounter').value;
  const product = document.getElementById('phProduct').value;
  const scoped = scopeItems(status, counter, product);
  renderDimFilters({
    designs: uniqSorted(scoped.map(r => r.design)),
    weights: uniqSorted(scoped.map(r => r.weight)),
    lengths: uniqSorted(scoped.map(r => fmtSize(r.length))),
    bangleSizes: uniqSorted(scoped.map(r => fmtSize(r.bangleSize))),
    ringSizes: uniqSorted(scoped.map(r => fmtSize(r.ringSize)))
  }, product);
}
function renderDimFilters(opts, product) {
  const wrap = document.getElementById('phDimFilters'); if (!wrap) return;
  const kind = productKind(product);
  let html = `<div><label>Design</label><select id="phDesign" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.designs || []).map(d => `<option>${escHtml(d)}</option>`).join('')}</select></div>`;
  if (kind === 'chain') {
    // BRO: "disign ki, lenth ki madhayana unna weithght drop dwon remove chei" — the Weight (gm)
    // dropdown between Design and Length is gone; Weight Range (gm) checkbox below still covers that.
    html += `<div><label>Length</label><select id="phLength" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.lengths || []).map(l => `<option>${escHtml(l)}</option>`).join('')}</select></div>`;
  } else if (kind === 'bangle') {
    html += `<div><label>Bangle Size</label><select id="phBangleSize" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.bangleSizes || []).map(b => `<option>${escHtml(b)}</option>`).join('')}</select></div>`;
  } else if (kind === 'ring') {
    html += `<div><label>Finger Size</label><select id="phRingSize" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.ringSizes || []).map(r => `<option>${escHtml(r)}</option>`).join('')}</select></div>`;
  }
  wrap.innerHTML = html;
}

// ---- Filtering + rendering, all local (instant, works offline) ----
function currentFilters() {
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  return {
    status: document.getElementById('phStatus').value, counter: document.getElementById('phCounter').value,
    product: val('phProduct'), design: val('phDesign'),
    length: val('phLength'), bangleSize: val('phBangleSize'), ringSize: val('phRingSize'),
    wtRangeOn: document.getElementById('phWtRangeOn').checked,
    wtFrom: val('phWtFrom'), wtTo: val('phWtTo'),
    q: document.getElementById('phQ').value.trim().toUpperCase()
  };
}
function filterItems(items, f) {
  const wtFrom = f.wtRangeOn && f.wtFrom !== '' ? parseFloat(f.wtFrom) : null;
  const wtTo = f.wtRangeOn && f.wtTo !== '' ? parseFloat(f.wtTo) : null;
  return items.filter(r => {
    if (f.status !== 'all' && r.status !== f.status) return false;
    if (f.counter && (r.counter || '').trim() !== f.counter) return false;
    if (f.product && (r.productName || '').trim() !== f.product) return false;
    if (f.design && (r.design || '').trim() !== f.design) return false;
    if (f.length && fmtSize(r.length) !== f.length) return false;
    if (f.bangleSize && fmtSize(r.bangleSize) !== f.bangleSize) return false;
    if (f.ringSize && fmtSize(r.ringSize) !== f.ringSize) return false;
    if (wtFrom != null || wtTo != null) {
      const w = parseFloat(r.weight);
      if (isNaN(w)) return false;
      if (wtFrom != null && w < wtFrom) return false;
      if (wtTo != null && w > wtTo) return false;
    }
    if (f.q && normTag(r.tagNo).indexOf(normTag(f.q)) === -1 && (r.productName || '').toUpperCase().indexOf(f.q) === -1) return false;
    return true;
  }).sort((a, b) => new Date(b.addedAt || 0) - new Date(a.addedAt || 0));
}
function applyFiltersAndRender() {
  PH.items = filterItems(ALL_ITEMS, currentFilters());
  VISIBLE.count = Math.min(PH.limit, PH.items.length);
  renderGrid();
}
function renderGrid() {
  const grid = document.getElementById('grid'), moreWrap = document.getElementById('moreWrap');
  if (!PH.items.length) { grid.innerHTML = '<div class="empty">No photos found for this filter.</div>'; moreWrap.innerHTML = ''; return; }
  grid.innerHTML = PH.items.slice(0, VISIBLE.count).map((r, i) => tileHtml(r, i)).join('');
  hydrateVisibleImages();
  moreWrap.innerHTML = (VISIBLE.count < PH.items.length)
    ? `<button class="btn btn-sec" style="width:auto;padding:9px 22px;" onclick="loadMore()">Load more (${VISIBLE.count} of ${PH.items.length})</button>`
    : `${PH.items.length} of ${PH.items.length} shown`;
}
function loadMore() { VISIBLE.count = Math.min(VISIBLE.count + PH.limit, PH.items.length); renderGrid(); }

function tileHtml(r, idx) {
  const pill = r.status === 'sold' ? '<span class="pill" style="background:var(--red);">SOLD</span>' : '<span class="pill" style="background:var(--green);">STOCK</span>';
  const label = r.tagNo || properCase(r.productName) || 'Item';
  return `<div class="tile" data-photo="${escHtml(r.photo || '')}" onclick="openViewer(${idx})">
      <img alt="${escHtml(label)}">
      ${pill}
      <div class="tag">${escHtml(label)}</div>
    </div>`;
}
function hydrateVisibleImages() {
  document.querySelectorAll('#grid .tile[data-photo]').forEach(tile => {
    const photo = tile.getAttribute('data-photo');
    tile.removeAttribute('data-photo');
    const img = tile.querySelector('img');
    resolveImgSrc(photo).then(src => { if (src) img.src = src; else tile.classList.add('tile-offline'); });
  });
}

// ---- Lightbox: tap a thumbnail -> big photo; swipe or ◀▶ -> next/prev. The item's Sheet data shows as
// a small, fixed table under the photo at all times (BRO: "phto taluka data fix ga chinna table laga
// chesi, kinda fix ga pettu") — no tap needed to reveal it, and it never disappears while sliding. ----
function openViewer(idx) {
  PH.openIdx = idx;
  const old = document.getElementById('phModal'); if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'phModal';
  div.className = 'overlay';
  div.innerHTML = `<div class="stage-box">
      <button class="close-x" onclick="document.getElementById('phModal').remove()">✕</button>
      <div id="phStage" class="stage" style="touch-action:none;overflow:hidden;">
        <button class="nav-btn left" onclick="navPhoto(-1)">◀</button>
        <img id="phStageImg" src="" style="user-select:none;-webkit-user-drag:none;">
        <button class="nav-btn right" onclick="navPhoto(1)">▶</button>
        <div style="position:absolute;bottom:6px;right:8px;z-index:4;display:flex;gap:6px;">
          <button class="nav-btn" style="position:static;width:32px;height:32px;font-size:16px;" onclick="sharePhoto()" title="Share">📤</button>
          <button class="nav-btn" style="position:static;width:32px;height:32px;font-size:18px;" onclick="zoomBy(-0.6)" title="Zoom out">−</button>
          <button class="nav-btn" style="position:static;width:32px;height:32px;font-size:18px;" onclick="zoomBy(0.6)" title="Zoom in">+</button>
        </div>
      </div>
      <div id="phCtrLbl" class="ctr-lbl"></div>
      <div id="phInfoBox" class="info-box"></div>
    </div>`;
  document.body.appendChild(div);
  div.addEventListener('click', e => { if (e.target === div) div.remove(); });

  document.addEventListener('keydown', keyNav);
  setupZoomPan();
  renderStage();
}
function keyNav(e) {
  if (!document.getElementById('phModal')) { document.removeEventListener('keydown', keyNav); return; }
  if (e.key === 'ArrowLeft') navPhoto(-1);
  else if (e.key === 'ArrowRight') navPhoto(1);
  else if (e.key === 'Escape') document.getElementById('phModal').remove();
  else if (e.key === '+' || e.key === '=') zoomBy(0.6);
  else if (e.key === '-') zoomBy(-0.6);
}
function navPhoto(dir) {
  const n = PH.items.length; if (!n) return;
  PH.openIdx = (PH.openIdx + dir + n) % n;
  if (window.__phResetZoom) window.__phResetZoom(); // new photo always starts at 1x
  renderStage();
}

// ---- Zoom / pan: mouse wheel / +− buttons / keyboard +− on desktop; pinch (2-finger) + double-tap
// on touch zoom the photo. Swipe-to-next-photo only fires at 1x zoom; once zoomed in, one-finger drag
// pans instead of swiping to the next photo. ----
function setupZoomPan() {
  const stage = document.getElementById('phStage');
  const img = document.getElementById('phStageImg');
  if (!stage || !img) return;
  let scale = 1, tx = 0, ty = 0;
  let pinchStartDist = 0, pinchStartScale = 1;
  let dragging = false, dragStartX = 0, dragStartY = 0, dragOrigTx = 0, dragOrigTy = 0;
  let swipeStartX = null;
  let lastTapAt = 0;

  const clampScale = s => Math.max(1, Math.min(4, s));
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; img.style.cursor = scale > 1.01 ? 'grab' : 'zoom-in'; };
  window.__phResetZoom = () => { scale = 1; tx = 0; ty = 0; apply(); };
  window.__phZoomBy = (delta) => { scale = clampScale(scale + delta); if (scale <= 1.01) { tx = 0; ty = 0; } apply(); };
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    scale = clampScale(scale + (e.deltaY < 0 ? 0.4 : -0.4));
    if (scale <= 1.01) { tx = 0; ty = 0; }
    apply();
  }, { passive: false });

  stage.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = dist(e.touches[0], e.touches[1]); pinchStartScale = scale; swipeStartX = null;
    } else if (e.touches.length === 1) {
      swipeStartX = e.touches[0].clientX;
      if (scale > 1.01) { dragging = true; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY; dragOrigTx = tx; dragOrigTy = ty; }
    }
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      scale = clampScale(pinchStartScale * (dist(e.touches[0], e.touches[1]) / pinchStartDist));
      if (scale <= 1.01) { tx = 0; ty = 0; }
      apply();
    } else if (dragging && e.touches.length === 1) {
      e.preventDefault();
      tx = dragOrigTx + (e.touches[0].clientX - dragStartX);
      ty = dragOrigTy + (e.touches[0].clientY - dragStartY);
      apply();
    }
  }, { passive: false });

  stage.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
      pinchStartDist = 0;
      const wasDragging = dragging; dragging = false;
      if (!wasDragging && scale <= 1.01 && swipeStartX != null && e.changedTouches.length) {
        const dx = e.changedTouches[0].clientX - swipeStartX;
        if (Math.abs(dx) > 40) { navPhoto(dx > 0 ? -1 : 1); swipeStartX = null; return; }
      }
      swipeStartX = null;
      if (!wasDragging) {
        const now = Date.now();
        if (now - lastTapAt < 300) {
          scale = scale > 1.01 ? 1 : 2.5; if (scale <= 1.01) { tx = 0; ty = 0; } apply();
          lastTapAt = 0;
        } else {
          lastTapAt = now;
        }
      }
    }
  }, { passive: true });

  img.addEventListener('dblclick', () => {
    scale = scale > 1.01 ? 1 : 2.5; if (scale <= 1.01) { tx = 0; ty = 0; } apply();
  });
}
function zoomBy(delta) { if (window.__phZoomBy) window.__phZoomBy(delta); }

// ---- Share (BRO: "need unnavi share option kuda ravali") — shares the item's real Drive link (not
// the resized thumbnail URL) so whoever receives it can open the actual full photo. Uses the native
// share sheet where available (phones, most tablets); falls back to copying the link, then to just
// opening it in a new tab if even clipboard access isn't available. ----
async function sharePhoto() {
  const r = PH.items[PH.openIdx]; if (!r || !r.photo) return;
  const title = (r.tagNo || r.productName || 'Photo') + ' — VSR GOLD';
  const url = r.photo;
  if (navigator.share) {
    try { await navigator.share({ title, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(url); toastMsg('Photo link copied — paste it anywhere to share'); return; } catch (e) {}
  }
  window.open(url, '_blank');
}
function toastMsg(msg) {
  const old = document.getElementById('phToast'); if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'phToast';
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#241A33;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3);';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
async function renderStage() {
  const r = PH.items[PH.openIdx]; if (!r) return;
  const img = document.getElementById('phStageImg');
  const lbl = document.getElementById('phCtrLbl');
  const box = document.getElementById('phInfoBox');
  img.removeAttribute('src'); img.alt = 'Loading...';
  lbl.textContent = (r.tagNo || properCase(r.productName) || 'Item') + '  ·  ' + (PH.openIdx + 1) + ' / ' + PH.items.length + (r.status === 'sold' ? '  ·  SOLD' : '  ·  IN STOCK');
  // Fixed table, always shown, updates immediately — doesn't wait on the image (BRO: "phto taluka data
  // fix ga chinna table laga chesi, kinda fix ga pettu").
  if (box) box.innerHTML = infoHtml(r);
  const src = await resolveImgSrc(r.photo);
  // the person may have swiped to a different photo while this one was still downloading
  if (PH.items[PH.openIdx] !== r) return;
  if (src) img.src = src; else img.alt = '📷 Not downloaded yet — connect once to view this photo offline';
}
function infoHtml(r) {
  if (!r) return '';
  const isDia = r.type === 'Diamond';
  // BRO: "denikaite lenth undo adi select chesinapudu matrame lenth box ravali. ring size or bangle
  // size kuda same" — only whichever ONE of Length / Bangle Size / Ring Size actually applies to this
  // item's product shows up, same as the filter dropdowns already do.
  const kind = productKind(r.productName);
  let sizeRow = null;
  if (kind === 'chain' && fmtSize(r.length)) sizeRow = ['Length', fmtSize(r.length), true];
  else if (kind === 'bangle' && fmtSize(r.bangleSize)) sizeRow = ['Bangle Size', fmtSize(r.bangleSize), true];
  else if (kind === 'ring' && fmtSize(r.ringSize)) sizeRow = ['Ring Size', fmtSize(r.ringSize), true];
  // BRO: "TYPE VADDULE, PRODUCT FROM KUDA NO NEED" — dropped both; "TAG NO AND LENTH KODDIGA HILITE
  // AVALI, BANGLE SIZE RING SIZE KUDA BOLD AVALI" — Tag No and whichever size field applies get the
  // highlighted/bold treatment (the 3rd item in each row below).
  const rows = [
    ['Tag No', r.tagNo || '—', true], ['Product', properCase(r.productName)],
    !isDia ? ['Design', properCase(r.design)] : null, !isDia ? ['Tunch', r.tunch] : null,
    !isDia ? ['Weight (gm)', fmtWt(r.weight)] : null,
    isDia ? ['Gross Wt', fmtWt(r.gross)] : null, isDia ? ['Net Wt', fmtWt(r.net)] : null,
    isDia ? ['Carat', r.carat] : null, isDia ? ['Clarity', r.clarity] : null, isDia ? ['Color', r.color] : null,
    sizeRow,
    ['Counter', properCase(r.counter)],
    r.status === 'sold' ? ['Sold Date', fmtDMY(r.soldDate)] : null
  ].filter(Boolean);
  return `<table class="info">` +
    rows.map(([l, v, hl]) => `<tr${hl ? ' class="hl"' : ''}><td class="lbl">${escHtml(l)}</td><td class="val">${escHtml(v == null || v === '' ? '—' : v)}</td></tr>`).join('') +
    `</table>`;
}

// ============================================================
// v-add (BRO: "stock phtos lo ee part add chei. without login... only count matrame ravali") —
// Overview (counter → product/design count, count-only) + Sold Data (date-wise DSR sold list) tabs.
// Both are computed from locally-cached snapshots (STOCK_SNAPSHOT / SOLD_SNAPSHOT, set up further
// below) fetched via the SAME StockBackend actions the main portal already uses — no new backend
// action beyond adding `design` to dailySales_'s output. Fully separate code path from the Photos tab
// above: doesn't touch ALL_ITEMS or any existing function.
// ============================================================
function showTab(name) {
  ['Photos', 'Overview', 'Sold', 'Receiving', 'Rdr'].forEach(t => {
    document.getElementById('tab' + t).style.display = (t === name) ? '' : 'none';
    document.getElementById('tabBtn' + t).classList.toggle('active', t === name);
  });
  // Cheap, synchronous, reads only the already-cached arrays — safe to re-render every time the tab
  // is opened, so it's always showing the latest data that's been synced.
  if (name === 'Overview') {
    if (document.getElementById('ovLedgerView').style.display !== 'none') { ovLoadLedger(); }
    else if (OV.curCounter) { ovLoadDimOptions(); ovLoadDetail(); }
    else { ovLoadTiles(); }
  }
  if (name === 'Sold') loadSoldData();
  if (name === 'Receiving') loadReceivingData();
  if (name === 'Rdr') loadRdrData();
}

// ---- Overview: counter tiles (stock-in-hand PCS only) -> product/design-wise count ----
// Everything below reads ONLY the cached STOCK_SNAPSHOT array (no live api() call per click), so it
// works instantly and fully offline once that snapshot has been fetched at least once.
const KNOWN_COUNTERS = ['Bangles Counter', 'Necklace Counter', 'Chain Counter', 'Silver Counter',
  'Finger Ring Counter', 'Ear Ring Counter', 'Diamond Counter', 'Main Hub'];
const OV = { curCounter: null };

function rowCounter_(r) { return String(r.counter || '').trim() || 'Main Hub'; }
function rowQty_(r) { return parseFloat(r.qty) || 1; }
function uniqSorted_(arr) {
  const isNum = s => /^-?\d+(\.\d+)?$/.test(s);
  return Array.from(new Set(arr)).sort((a, b) => isNum(a) && isNum(b) ? parseFloat(a) - parseFloat(b) : a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
}

function ovLoadTiles() {
  const box = document.getElementById('ovTiles');
  if (!STOCK_SNAPSHOT.length) {
    box.innerHTML = (navigator.onLine
      ? '<div class="loading"><span class="spinner"></span>Loading...</div>'
      : '<div class="empty">No offline data saved yet — connect once to load.</div>') + reloadBtnHtml();
    return;
  }
  // Union of the known counters (so a zero-stock counter still shows a 0 tile, same as before) with
  // whatever counter names are actually present in the data (adapts automatically if a new counter is
  // ever added in the Sheet without needing this file updated).
  const totals = {};
  KNOWN_COUNTERS.forEach(c => totals[c] = 0);
  STOCK_SNAPSHOT.forEach(r => { const c = rowCounter_(r); totals[c] = (totals[c] || 0) + rowQty_(r); });
  // BRO: "all pages lo kinda totals ravali" — a grand total across every counter, at the bottom of the tiles.
  const grandTotal = Object.values(totals).reduce((s, n) => s + n, 0);
  box.innerHTML = Object.keys(totals).map(c => `
    <div class="ov-tile" data-counter="${escHtml(c)}" onclick="ovOpenCounter(this.dataset.counter)">
      <div class="ov-name">${escHtml(c)}</div>
      <div class="ov-count">${totals[c]}</div>
      <div class="ov-unit">PCS IN STOCK</div>
    </div>`).join('') + `<div class="note" style="grid-column:1/-1;text-align:right;padding-top:8px;">Total: <b>${grandTotal} pcs</b></div>`;
}

function ovBackToTiles() {
  document.getElementById('ovDetailView').style.display = 'none';
  document.getElementById('ovTilesView').style.display = '';
}

function ovOpenCounter(counter) {
  OV.curCounter = counter;
  document.getElementById('ovTilesView').style.display = 'none';
  document.getElementById('ovDetailView').style.display = '';
  document.getElementById('ovLedgerView').style.display = 'none';
  document.getElementById('ovDetailTitle').textContent = counter;
  document.getElementById('ovByDesign').checked = false;
  document.getElementById('ovWtRangeOn').checked = false;
  document.getElementById('ovWtRangeBox').style.display = 'none';
  ovLoadDimOptions();
  ovLoadDetail();
}

// Bangle Size / Ring Size / Length dropdowns — same cascade rule as the Photos filters: only the sizes
// that actually exist somewhere in THIS counter's cached stock get a dropdown at all.
function ovLoadDimOptions() {
  const box = document.getElementById('ovDimFilters');
  const rows = STOCK_SNAPSHOT.filter(r => rowCounter_(r) === OV.curCounter);
  const bangleSizes = uniqSorted_(rows.map(r => fmtSize(r.bangleSize)).filter(Boolean));
  const ringSizes = uniqSorted_(rows.map(r => fmtSize(r.ringSize)).filter(Boolean));
  const lengths = uniqSorted_(rows.map(r => fmtSize(r.length)).filter(Boolean));
  const opt = (id, label, values) => !values.length ? '' :
    `<div><label>${label}</label><select id="${id}" onchange="ovLoadDetail()"><option value="">All</option>${values.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('')}</select></div>`;
  box.innerHTML = opt('ovBangleSize', 'Bangle Size', bangleSizes) + opt('ovRingSize', 'Ring Size', ringSizes) + opt('ovLength', 'Length', lengths);
}

function ovLoadDetail() {
  const body = document.getElementById('ovDetailBody');
  const byDesign = document.getElementById('ovByDesign').checked;
  const getVal = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const bangleSize = getVal('ovBangleSize'), ringSize = getVal('ovRingSize'), length = getVal('ovLength');
  // v-add (BRO: "wt kuda ivu. wt kosam check box ivu. adi click cheste, from and to wt box lu ravali")
  // — same From/To weight-range filter as Photos, narrowing which rows get counted (the result shown
  // is still count-only — weight itself is never displayed here, only used to filter).
  const wtRangeOn = document.getElementById('ovWtRangeOn').checked;
  const wtFrom = wtRangeOn ? parseFloat(getVal('ovWtFrom')) : NaN;
  const wtTo = wtRangeOn ? parseFloat(getVal('ovWtTo')) : NaN;

  let rows = STOCK_SNAPSHOT.filter(r => rowCounter_(r) === OV.curCounter);
  if (bangleSize) rows = rows.filter(r => fmtSize(r.bangleSize) === bangleSize);
  if (ringSize) rows = rows.filter(r => fmtSize(r.ringSize) === ringSize);
  if (length) rows = rows.filter(r => fmtSize(r.length) === length);
  if (wtRangeOn && (!isNaN(wtFrom) || !isNaN(wtTo))) {
    rows = rows.filter(r => {
      const w = parseFloat(r.weight);
      if (isNaN(w)) return false;
      if (!isNaN(wtFrom) && w < wtFrom) return false;
      if (!isNaN(wtTo) && w > wtTo) return false;
      return true;
    });
  }

  if (!STOCK_SNAPSHOT.length) {
    body.innerHTML = (navigator.onLine ? '<div class="loading"><span class="spinner"></span>Loading...</div>' : '<div class="empty">No offline data saved yet — connect once to load.</div>') + reloadBtnHtml();
    return;
  }
  const g = {};
  rows.forEach(r => {
    const design = String(r.design || '').trim();
    const key = byDesign ? (r.productName + '|' + design) : r.productName;
    if (!g[key]) g[key] = { product: r.productName, design: byDesign ? design : '', pcs: 0 };
    g[key].pcs += rowQty_(r);
  });
  const list = Object.values(g).sort((a, b) => b.pcs - a.pcs);
  if (!list.length) { body.innerHTML = '<div class="empty">No items.</div>'; return; }
  let totalPcs = 0;
  let html = `<div class="ov-table-wrap"><table class="ov-table"><thead><tr><th>Product</th>${byDesign ? '<th>Design</th>' : ''}<th style="text-align:right;">Count</th></tr></thead><tbody>`;
  list.forEach(r => {
    totalPcs += r.pcs;
    html += `<tr><td>${escHtml(properCase(r.product))}</td>${byDesign ? `<td>${escHtml(properCase(r.design) || '—')}</td>` : ''}<td style="text-align:right;">${r.pcs}</td></tr>`;
  });
  html += `</tbody></table></div><div class="note" style="text-align:right;padding-top:8px;">Total: <b>${totalPcs} pcs</b></div>`;
  body.innerHTML = html;
}

// ============================================================
// v-add (BRO's Opening/Closing Ledger — "counter name pai click cheste... opening coutn, closing
// count, sold coutn, return count, outlet issue, ila all data tho product wise disine wise ani
// ravali. tabale laga ravali"). Formula (BRO, verbatim): "close stock ante, all sale, all returns
// (damage/repair) ivi minus avali, and reciving stock plus avali. out issue kuda opening stock lo
// minus avali... opening stock ninnati closing" — i.e. for any date D:
//   Closing(D) = OpeningBaseline + Receiving(<=D) - Sale(<=D) - OutletIssue(<=D) - Return/Repair(<=D)
//   Opening(D) = Closing(D-1)            [same formula evaluated up to D-1]
// v-add (BRO's Return/Damage/Repair feature): the "Return" column now shows the real combined count
// of Return+Damage+Repair for that day (Return/Damage/Repair form in the DSR section — see
// DSRBackend.gs's "Return Damage Repair" sheet, surfaced here via ledgerData's "rdr" array), clickable
// for a Tag No / Reason / Employee breakdown. The single-day Sold/Outlet Issue columns shown in the
// table are that day's rows only (date === D exactly) — Closing minus Opening still equals
// Receiving(D) - Sold(D) - OutletIssue(D) - Return/Damage/Repair(D), it's just that Receiving(D)
// itself isn't shown as its own column, matching BRO's requested column list exactly.
//
// Sale/Outlet-Issue/RDR rows come from DSRBackend.gs's "ledgerData" action (Main file + Archive for
// Sale, the "Outlet Issue" tab for Outlet Issue, the "Return Damage Repair" sheet for Return/Damage/
// Repair) — those rows carry no Counter, so each one is attributed to a counter by looking its Tag No
// up in the SAME Stock/Sold snapshots already cached for the rest of this page (BRO: "tag no stock
// level file lo undi. aa tag no batti search chesi ivu"). A tag not found there is skipped entirely
// (BRO: "no tag item ni leave chei. stock level file lo unna stock matrame count ravali") — same rule
// as No-Tag items.
//
// Not offline-cached like Overview/Sold Data above (needs a live call to the separate DSR backend);
// results for a given date are kept in an in-memory cache for this app session only, so re-picking a
// date already looked at doesn't re-fetch.
// ============================================================
function allEntryRows_() { return STOCK_SNAPSHOT.concat(SOLD_SNAPSHOT); }
function buildTagIndex_() {
  const idx = {};
  // Stock (currently in hand) checked last so it wins over Sold if a tag somehow appears in both —
  // in practice a tag is only ever in one of the two at a time.
  SOLD_SNAPSHOT.forEach(r => { if (r.tagNo) idx[normTag(r.tagNo)] = { counter: rowCounter_(r), productName: r.productName, design: r.design || '' }; });
  STOCK_SNAPSHOT.forEach(r => { if (r.tagNo) idx[normTag(r.tagNo)] = { counter: rowCounter_(r), productName: r.productName, design: r.design || '' }; });
  return idx;
}
function prevDateStr_(d) {
  const dt = new Date(d + 'T00:00:00');
  dt.setDate(dt.getDate() - 1);
  const p = n => String(n).padStart(2, '0');
  return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
}
const LEDGER_CACHE = {}; // { [uptoDate]: {sales:[...], outletIssues:[...], rdr:[...]} } — this session only.
const LEDGER_RDR_ROWS = {}; // { [date]: rdr[] } — v-add (Return/Damage/Repair) — for ovShowRdrDetail's popup
async function fetchLedgerUpto_(uptoDate) {
  if (LEDGER_CACHE[uptoDate]) return LEDGER_CACHE[uptoDate];
  const res = await dsrApi({ action: 'ledgerData', uptoDate });
  if (!res || !res.ok) throw new Error((res && res.message) || 'Could not load DSR data.');
  const data = { sales: res.sales || [], outletIssues: res.outletIssues || [], rdr: res.rdr || [] };
  LEDGER_CACHE[uptoDate] = data;
  return data;
}
// v-add (BRO's Return/Damage/Repair feature — "stock phto lo kuda option ivu") — a tiny reusable popup,
// same dark-overlay look as the photo viewer (openViewer above) but a plain white info card instead.
function ovSimpleModal(innerHtml) {
  const old = document.getElementById('ovSimpleModal'); if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'ovSimpleModal';
  div.className = 'overlay';
  div.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:92vw;width:420px;max-height:82vh;overflow-y:auto;padding:16px;position:relative;">
      <button style="float:right;background:var(--bg);color:var(--text);border:1.5px solid var(--gold);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;" onclick="document.getElementById('ovSimpleModal').remove()">✕</button>
      <div style="clear:both;"></div>
      ${innerHtml}
    </div>`;
  document.body.appendChild(div);
  div.addEventListener('click', e => { if (e.target === div) div.remove(); });
}
function ovOpenLedgerFromTitle() {
  if (!OV.curCounter) return;
  document.getElementById('ovDetailView').style.display = 'none';
  document.getElementById('ovLedgerView').style.display = '';
  document.getElementById('ovLedgerTitle').textContent = OV.curCounter + ' — Opening / Closing Ledger';
  const dateInput = document.getElementById('ovLedgerDate');
  if (!dateInput.value) dateInput.value = todayStr_ph();
  ovLoadLedger();
}
function ovBackToDetailFromLedger() {
  document.getElementById('ovLedgerView').style.display = 'none';
  document.getElementById('ovDetailView').style.display = '';
}
async function ovLoadLedger() {
  const body = document.getElementById('ovLedgerBody');
  const counter = OV.curCounter;
  if (!counter) return;
  const byDesign = document.getElementById('ovByDesign').checked;
  const dateVal = document.getElementById('ovLedgerDate').value || todayStr_ph();
  if (!STOCK_SNAPSHOT.length && !SOLD_SNAPSHOT.length) {
    body.innerHTML = '<div class="empty" style="color:var(--dmuted);">No offline data saved yet — connect once to load.</div>' + reloadBtnHtml();
    return;
  }
  body.innerHTML = '<div class="loading" style="color:var(--dmuted);"><span class="spinner"></span>Loading DSR data...</div>';
  let ledgerData;
  try {
    ledgerData = await fetchLedgerUpto_(dateVal);
  } catch (e) {
    body.innerHTML = `<div class="empty" style="color:var(--dmuted);">${escHtml(e.message || 'Could not load DSR data — check the connection.')}</div>` + reloadBtnHtml();
    return;
  }
  // the person may have picked a different date, or left this view, while the fetch above was in flight
  if (OV.curCounter !== counter || document.getElementById('ovLedgerView').style.display === 'none') return;
  if (document.getElementById('ovLedgerDate').value !== dateVal) return;

  const prevDate = prevDateStr_(dateVal);
  const tagIdx = buildTagIndex_();
  const entryRows = allEntryRows_().filter(r => rowCounter_(r) === counter);

  const groupKey_ = (productName, design) => byDesign ? (productName + '|' + String(design || '').trim()) : productName;

  // Every Product(+Design) group this counter has ever had an Opening/Receiving entry for.
  const groups = {};
  entryRows.forEach(r => {
    const key = groupKey_(r.productName, r.design);
    if (!groups[key]) groups[key] = { product: r.productName, design: byDesign ? String(r.design || '').trim() : '' };
  });

  function baseline(key) {
    return entryRows.filter(r => r.entryType === 'Opening Stock' && groupKey_(r.productName, r.design) === key)
      .reduce((s, r) => s + rowQty_(r), 0);
  }
  // v-fix (BRO: "mangalasutra -2 vachindi deniki" — a product going negative meant stock was being
  // subtracted for a Sale/Outlet Issue with nothing ever added back for it. Stock Level's own
  // entryType isn't just "Receiving Stock" — a "Return" entry (an item physically coming back into
  // this counter's stock) is just as much an inbound addition, so it has to count here too.
  // v-add (BRO's Return/Damage/Repair feature): "Damage Receive" is the entryType used when a
  // Damage/Repair item is marked Received Back (from the DSR section's Return/Damage/Repair form) —
  // also inbound, kept as its own entryType so it's never confused with a normal Stock Entry
  // "Receiving Stock" row, or with a plain Stock Level "Return" entry.
  function receivingUpto(key, upto) {
    return entryRows.filter(r => (r.entryType === 'Receiving Stock' || r.entryType === 'Return' || r.entryType === 'Damage Receive') && r.entryDate && r.entryDate <= upto && groupKey_(r.productName, r.design) === key)
      .reduce((s, r) => s + rowQty_(r), 0);
  }
  // Sale/Outlet-Issue rows carry no Counter of their own — resolved here via Tag No against the same
  // Stock/Sold snapshot used for the rest of this page. Returns null (skip) for a tag not found there,
  // or one that belongs to a different counter.
  function resolveKey_(row) {
    const hit = tagIdx[normTag(row.tagNo)];
    if (!hit || hit.counter !== counter) return null;
    return groupKey_(hit.productName, hit.design);
  }
  function sumMatching(list, key, pred) {
    let n = 0;
    list.forEach(row => { if (pred(row) && resolveKey_(row) === key) n++; });
    return n;
  }
  const saleUpto = (key, upto) => sumMatching(ledgerData.sales, key, s => s.date <= upto);
  const saleOn = (key, d) => sumMatching(ledgerData.sales, key, s => s.date === d);
  const outletUpto = (key, upto) => sumMatching(ledgerData.outletIssues, key, o => o.date <= upto);
  const outletOn = (key, d) => sumMatching(ledgerData.outletIssues, key, o => o.date === d);
  // v-add (BRO's Return/Damage/Repair feature) — the Ledger's "Return" column, combining all 3
  // reasons (Return/Damage/Repair) into one number for that day, clickable for a per-item detail popup.
  const rdrUpto = (key, upto) => sumMatching(ledgerData.rdr, key, o => o.date <= upto);
  const rdrRowsOn = (key, d) => (ledgerData.rdr || []).filter(o => o.date === d && resolveKey_(o) === key);
  const rdrOn = (key, d) => rdrRowsOn(key, d).length;
  LEDGER_RDR_ROWS[dateVal] = ledgerData.rdr || [];
  // v-add (BRO: "opening closing sold return ila anni icharu, danto patu receiving kuda ivu" — the
  // ledger table itself should also show, per row, how many pieces were RECEIVED that exact day.
  // v-fix (BRO: "opening stock coutn and closing stock count different undi ante day lo sale or
  // receved, or return or outlet issue edo okati jarigi untundi kada bro. adi kuda clear ga teliyali
  // kada" — this column used to count ONLY Entry Type = "Receiving Stock", but the actual
  // Opening→Closing math above (receivingUpto, a few lines up) always counted "Receiving Stock" OR
  // "Return" OR "Damage Receive" as inbound. That mismatch is exactly what made some days' Closing
  // move with nothing visible to explain it — a customer Return or a Damage/Repair item coming back
  // into stock bumped the real count but never showed in this column. Now this matches the real math
  // exactly, so whatever moves Closing always shows up here.
  const receivingOn = (key, d) => entryRows.filter(r => (r.entryType === 'Receiving Stock' || r.entryType === 'Return' || r.entryType === 'Damage Receive') && r.entryDate === d && groupKey_(r.productName, r.design) === key).reduce((s, r) => s + rowQty_(r), 0);

  // v-fix (BRO: "tag no ki lookup chesi count cheste saripotundi kada" — for TODAY, closing doesn't
  // need to be rebuilt from the whole transaction history at all: the live Stock snapshot already IS
  // today's true physical count, tag by tag, same as the Overview "Current Stock" card. Historical
  // DSR data (old duplicate rows, sales recorded before Stock Level even existed for a tag that's
  // since been reused, etc.) can never perfectly reconstruct a running total back to day one — but it
  // doesn't need to for TODAY, since we can just count what's physically in Stock right now. The
  // additive formula is kept ONLY for a PAST date (no live snapshot exists for a day that's already
  // gone), which is also the only place old-data imperfections can still show up.
  const isToday = dateVal === todayStr_ph();
  function liveCount(key) {
    return STOCK_SNAPSHOT.filter(r => rowCounter_(r) === counter && groupKey_(r.productName, r.design) === key)
      .reduce((s, r) => s + rowQty_(r), 0);
  }

  const list = Object.keys(groups).map(key => {
    const base = baseline(key);
    const closingToday = isToday ? liveCount(key)
      : (base + receivingUpto(key, dateVal) - saleUpto(key, dateVal) - outletUpto(key, dateVal) - rdrUpto(key, dateVal));
    const closingPrev = base + receivingUpto(key, prevDate) - saleUpto(key, prevDate) - outletUpto(key, prevDate) - rdrUpto(key, prevDate);
    return {
      product: groups[key].product, design: groups[key].design, key: key,
      opening: closingPrev, closing: closingToday, receiving: receivingOn(key, dateVal),
      sold: saleOn(key, dateVal), ret: rdrOn(key, dateVal), outlet: outletOn(key, dateVal)
    };
  }).sort((a, b) => a.product.localeCompare(b.product, undefined, { numeric: true, sensitivity: 'base' }) || a.design.localeCompare(b.design, undefined, { numeric: true, sensitivity: 'base' }));

  if (!list.length) { body.innerHTML = '<div class="empty" style="color:var(--dmuted);">No ledger data for this counter yet.</div>'; return; }

  // BRO: "products left alignment ok, remaing all center alinment ravali. and all heading names
  // single line lo ravali" — Product (and Design) stay left-aligned; every other column, header and
  // data cell alike, is centered, and no heading wraps to a 2nd line.
  // BRO: "all pages lo kinda totals ravali" — a totals row summing every column, at the bottom of the table.
  const tot = list.reduce((s, r) => {
    s.opening += r.opening; s.closing += r.closing; s.receiving += r.receiving; s.sold += r.sold; s.ret += r.ret; s.outlet += r.outlet;
    return s;
  }, { opening: 0, closing: 0, receiving: 0, sold: 0, ret: 0, outlet: 0 });
  // v-fix (BRO: "closgin option ni chivara pettu" — Closing moved to the last column, so the row
  // reads left-to-right as the story of the day: Opening, then everything that moved it, then
  // Closing as the final result.
  let html = `<div class="ov-table-wrap"><table class="ledger-table"><thead><tr><th>Product</th>${byDesign ? '<th>Design</th>' : ''}<th style="text-align:center;">Opening</th><th style="text-align:center;">Receiving</th><th style="text-align:center;">Sold</th><th style="text-align:center;">Return</th><th style="text-align:center;">Outlet Issue</th><th style="text-align:center;">Closing</th></tr></thead><tbody>`;
  list.forEach(r => {
    const retCell = r.ret > 0 ? `<a href="#" onclick="ovShowRdrDetail('${escJs(r.key)}','${dateVal}','${escJs(properCase(r.product))}',${byDesign});return false;" style="color:#B03A2E;font-weight:800;text-decoration:underline;">${r.ret}</a>` : r.ret;
    html += `<tr><td>${escHtml(properCase(r.product))}</td>${byDesign ? `<td>${escHtml(properCase(r.design) || '—')}</td>` : ''}<td style="text-align:center;">${r.opening}</td><td style="text-align:center;">${r.receiving}</td><td style="text-align:center;">${r.sold}</td><td style="text-align:center;">${retCell}</td><td style="text-align:center;">${r.outlet}</td><td style="text-align:center;">${r.closing}</td></tr>`;
  });
  html += `<tr style="font-weight:800;border-top:2px solid var(--gold);"><td>Total</td>${byDesign ? '<td></td>' : ''}<td style="text-align:center;">${tot.opening}</td><td style="text-align:center;">${tot.receiving}</td><td style="text-align:center;">${tot.sold}</td><td style="text-align:center;">${tot.ret}</td><td style="text-align:center;">${tot.outlet}</td><td style="text-align:center;">${tot.closing}</td></tr>`;
  html += '</tbody></table></div>';
  body.innerHTML = html;
}
// v-add (BRO's Return/Damage/Repair feature) — clicking the Ledger's Return count opens this detail
// popup listing the individual Tag No / Reason / Employee behind that day's combined number.
function ovShowRdrDetail(key, date, productLabel, byDesign) {
  const rows = (LEDGER_RDR_ROWS[date] || []).filter(o => {
    const rowKey = byDesign ? (o.productName + '|' + String(o.design || '').trim()) : o.productName;
    return rowKey === key;
  });
  let inner = `<div style="font-weight:800;font-size:15px;margin-bottom:4px;">↩️ Return / Damage / Repair — ${escHtml(productLabel)}</div>
    <div class="note" style="text-align:left;padding:0 0 10px;">${fmtDMY(date)} · ${rows.length} item${rows.length === 1 ? '' : 's'}</div>`;
  if (!rows.length) {
    inner += '<div class="empty" style="padding:20px 0;">No detail found.</div>';
  } else {
    inner += `<div class="ov-table-wrap"><table class="ledger-table"><thead><tr><th>Tag No</th><th>Reason</th><th>Employee</th></tr></thead><tbody>` +
      rows.map(r => `<tr><td><b>${escHtml(r.tagNo || '—')}</b></td><td>${escHtml(r.reason || '—')}</td><td>${escHtml(properCase(r.employee) || '—')}</td></tr>`).join('') +
      '</tbody></table></div>';
  }
  ovSimpleModal(inner);
}

// v-add (BRO: "stock phto file lo opening closing sold return ila anni icharu, danto patu receiving
// kuda ivu. receiving ante stock entry form lo receiving dantlo enter chesina vi kavali. separata ga
// receiving ki oka tab pettu. dantlo search tag no ani kuda option ivu" — a standalone Receiving tab,
// separate from the Ledger's own Receiving-Upto total above). Only entryType === 'Receiving Stock' —
// Opening Stock (the very first stock-taking) and Return (a repaired/returned item coming back) are
// deliberately NOT "Receiving" per BRO's own definition ("stock entry form lo receiving dantlo enter
// chesina vi" — specifically the Receiving option in that form). Reads the same offline
// STOCK_SNAPSHOT + SOLD_SNAPSHOT arrays as everything else on this page — a received item that has
// since been sold still shows here, since a Sold row keeps its original entryType/entryDate too.
function populateReceivingCounterOptions_() {
  const sel = document.getElementById('recvCounter');
  if (!sel || sel.dataset.filled) return;
  sel.innerHTML = '<option value="">All Counters</option>' + KNOWN_COUNTERS.map(c => `<option>${escHtml(c)}</option>`).join('');
  sel.dataset.filled = '1';
}
function loadReceivingData() {
  populateReceivingCounterOptions_();
  const body = document.getElementById('receivingBody');
  const summary = document.getElementById('receivingSummary');
  if (!STOCK_SNAPSHOT.length && !SOLD_SNAPSHOT.length) {
    body.innerHTML = (navigator.onLine
      ? '<div class="loading"><span class="spinner"></span>Loading...</div>'
      : '<div class="empty">No offline data saved yet — connect once to load.</div>') + reloadBtnHtml();
    summary.textContent = '';
    return;
  }
  const range = dateRangeForMode_(RECV, 'recvStart', 'recvEnd');
  if (!range) { summary.textContent = ''; body.innerHTML = '<div class="empty">Select both Start and End date.</div>'; return; }
  const counter = document.getElementById('recvCounter').value;
  const q = document.getElementById('recvQ').value.trim().toUpperCase();
  const needleTag = normTag(q);
  let rows = allEntryRows_().filter(r => r.entryType === 'Receiving Stock' && r.entryDate && r.entryDate >= range.start && r.entryDate <= range.end);
  if (counter) rows = rows.filter(r => rowCounter_(r) === counter);
  if (q) rows = rows.filter(r => (needleTag && normTag(r.tagNo).indexOf(needleTag) > -1) || String(r.productName || '').toUpperCase().indexOf(q) > -1);
  // Most recently received first.
  rows = rows.slice().sort((a, b) => new Date(b.addedAt || b.entryDate || 0) - new Date(a.addedAt || a.entryDate || 0));

  if (!rows.length) {
    summary.textContent = '';
    body.innerHTML = '<div class="empty">No receiving entries found.</div>';
    return;
  }
  const totalPcs = rows.reduce((s, r) => s + rowQty_(r), 0);
  summary.textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + ' — ' + totalPcs + ' pcs';
  let html = '<div class="ov-table-wrap"><table class="ledger-table"><thead><tr><th>Date</th><th>Tag No</th><th>Product</th><th>Design</th><th>Counter</th><th style="text-align:center;">Qty</th><th style="text-align:center;">Weight</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr><td>${escHtml(r.entryDate || '—')}</td><td>${escHtml(r.tagNo || '—')}</td><td>${escHtml(properCase(r.productName) || '')}</td><td>${escHtml(properCase(r.design) || '—')}</td><td>${escHtml(rowCounter_(r))}</td><td style="text-align:center;">${rowQty_(r)}</td><td style="text-align:center;">${r.weight || '—'}</td></tr>`;
  });
  html += '</tbody></table></div>';
  body.innerHTML = html;
}

// v-add (BRO's Return/Damage/Repair feature — "stock phto lo kuda option ivu") — a read-only viewer
// tab, parallel to Receiving above, for the DSR section's Return/Damage/Repair entries. This data
// lives in DSRBackend.gs's "Return Damage Repair" sheet, not the Stock Level snapshots, so it's
// fetched live via the same ledgerData action the Ledger view uses (uptoDate = today returns the
// full list) — cached the same way (LEDGER_CACHE), so re-opening this tab doesn't re-fetch.
function populateRdrCounterOptions_() {
  const sel = document.getElementById('rdrCounter');
  if (!sel || sel.dataset.filled) return;
  sel.innerHTML = '<option value="">All Counters</option>' + KNOWN_COUNTERS.map(c => `<option>${escHtml(c)}</option>`).join('');
  sel.dataset.filled = '1';
}
async function loadRdrData() {
  populateRdrCounterOptions_();
  const body = document.getElementById('rdrBody');
  const summary = document.getElementById('rdrSummary');
  if (!STOCK_SNAPSHOT.length && !SOLD_SNAPSHOT.length) {
    body.innerHTML = (navigator.onLine
      ? '<div class="loading"><span class="spinner"></span>Loading...</div>'
      : '<div class="empty">No offline data saved yet — connect once to load.</div>') + reloadBtnHtml();
    summary.textContent = '';
    return;
  }
  body.innerHTML = '<div class="loading"><span class="spinner"></span>Loading...</div>';
  let ledgerData;
  try {
    ledgerData = await fetchLedgerUpto_(todayStr_ph());
  } catch (e) {
    body.innerHTML = `<div class="empty">${escHtml(e.message || 'Could not load data — check the connection.')}</div>` + reloadBtnHtml();
    summary.textContent = '';
    return;
  }
  if (document.getElementById('tabRdr').style.display === 'none') return;

  const range = dateRangeForMode_(RDR, 'rdrStart', 'rdrEnd');
  if (!range) { summary.textContent = ''; body.innerHTML = '<div class="empty">Select both Start and End date.</div>'; return; }
  const tagIdx = buildTagIndex_();
  const counter = document.getElementById('rdrCounter').value;
  const q = document.getElementById('rdrQ').value.trim().toUpperCase();
  const needleTag = normTag(q);
  let rows = (ledgerData.rdr || []).filter(r => r.date && r.date >= range.start && r.date <= range.end).map(r => {
    const hit = tagIdx[normTag(r.tagNo)];
    return Object.assign({}, r, { counter: hit ? hit.counter : '' });
  });
  if (counter) rows = rows.filter(r => r.counter === counter);
  if (q) rows = rows.filter(r => (needleTag && normTag(r.tagNo).indexOf(needleTag) > -1) || String(r.productName || '').toUpperCase().indexOf(q) > -1);
  rows = rows.slice().sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  if (!rows.length) {
    summary.textContent = '';
    body.innerHTML = '<div class="empty">No Return / Damage / Repair entries found.</div>';
    return;
  }
  summary.textContent = rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies');
  let html = '<div class="ov-table-wrap"><table class="ledger-table"><thead><tr><th>Date</th><th>Tag No</th><th>Product</th><th>Design</th><th>Reason</th><th>Counter</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr><td>${escHtml(r.date || '—')}</td><td>${escHtml(r.tagNo || '—')}</td><td>${escHtml(properCase(r.productName) || '')}</td><td>${escHtml(properCase(r.design) || '—')}</td><td>${escHtml(r.reason || '—')}</td><td>${escHtml(r.counter || '—')}</td></tr>`;
  });
  html += '</tbody></table></div>';
  body.innerHTML = html;
}

// ---- Sold Data: date-wise DSR-sold Tag No / Product / Design (Today by default, or a Custom range) ----
// Also reads only the cached SOLD_SNAPSHOT array — offline-capable the same way as Overview above.
// Sold By / Payment Status / Weight are deliberately NOT shown here — this page needs no login, so
// anyone with the link can open it; only Tag No/Product/Design/Counter (what was actually asked for).
const SOLD = { mode: 'today' };

function todayStr_ph() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
// v-add (BRO's per-tab accent colors) — shared by setSoldMode/setRecvMode/setRdrMode below so the
// Today/Yesterday/Custom Date buttons on each tab light up in THAT tab's own color, not always purple.
function applyDateModeStyle_(mode, todayBtn, yestBtn, customBtn, customBoxId, color) {
  [[todayBtn, 'today'], [yestBtn, 'yesterday'], [customBtn, 'custom']].forEach(([btn, m]) => {
    btn.style.background = mode === m ? color : '#fff';
    btn.style.color = mode === m ? '#fff' : color;
    btn.style.borderColor = color;
  });
  document.getElementById(customBoxId).style.display = mode === 'custom' ? '' : 'none';
}
function setSoldMode(mode) {
  SOLD.mode = mode;
  applyDateModeStyle_(mode, document.getElementById('soldModeTodayBtn'), document.getElementById('soldModeYesterdayBtn'), document.getElementById('soldModeCustomBtn'), 'soldCustomBox', 'var(--acc-sold)');
}
// v-add (BRO: "sold tab lo unnatu today yesteday custome date anniti lo pettu" — same Today/Yesterday/
// Custom Date quick-filter as Sold, now on Receiving and RDR too, each in that tab's own accent color.
const RECV = { mode: 'today' };
function setRecvMode(mode) {
  RECV.mode = mode;
  applyDateModeStyle_(mode, document.getElementById('recvModeTodayBtn'), document.getElementById('recvModeYesterdayBtn'), document.getElementById('recvModeCustomBtn'), 'recvCustomBox', 'var(--acc-receiving)');
  loadReceivingData();
}
const RDR = { mode: 'today' };
function setRdrMode(mode) {
  RDR.mode = mode;
  applyDateModeStyle_(mode, document.getElementById('rdrModeTodayBtn'), document.getElementById('rdrModeYesterdayBtn'), document.getElementById('rdrModeCustomBtn'), 'rdrCustomBox', 'var(--acc-rdr)');
  loadRdrData();
}
// Shared by loadReceivingData/loadRdrData below — turns a tab's {mode} into a concrete [start, end]
// date range, same today/yesterday/custom rule the Sold tab already uses.
function dateRangeForMode_(modeObj, startId, endId) {
  if (modeObj.mode === 'custom') {
    const start = document.getElementById(startId).value, end = document.getElementById(endId).value;
    return (start && end) ? { start, end } : null;
  }
  if (modeObj.mode === 'yesterday') { const d = prevDateStr_(todayStr_ph()); return { start: d, end: d }; }
  const d = todayStr_ph(); return { start: d, end: d };
}
function loadSoldData() {
  const body = document.getElementById('soldBody'), summary = document.getElementById('soldSummary');
  let start, end;
  if (SOLD.mode === 'custom') {
    start = document.getElementById('soldStart').value;
    end = document.getElementById('soldEnd').value;
    if (!start || !end) { body.innerHTML = '<div class="empty">Select both Start and End date.</div>'; summary.textContent = ''; return; }
  } else if (SOLD.mode === 'yesterday') {
    start = end = prevDateStr_(todayStr_ph());
  } else {
    start = end = todayStr_ph();
  }
  if (!SOLD_SNAPSHOT.length) {
    body.innerHTML = (navigator.onLine ? '<div class="loading"><span class="spinner"></span>Loading...</div>' : '<div class="empty">No offline data saved yet — connect once to load.</div>') + reloadBtnHtml();
    summary.textContent = '';
    return;
  }
  const rows = SOLD_SNAPSHOT.filter(r => r.soldDate >= start && r.soldDate <= end);
  if (!rows.length) { body.innerHTML = '<div class="empty">No items sold in this range.</div>'; summary.textContent = ''; return; }
  let pcs = 0;
  rows.forEach(r => pcs += rowQty_(r));
  summary.textContent = `Total Sold: ${pcs} pcs`;
  // BRO: "sold data lo date, tag no, poroduct, design, counter, weight, lenth, size... emp name, photo
  // view ani feilds anni ravali" — Weight, Size (whichever of Length/Bangle Size/Ring Size applies to
  // that row's product, same rule as the Photos lightbox), Employee Name (soldBy) and a Photo view
  // button, on top of what was already shown.
  // BRO: "tag no pai click cheste photo view avali" — Tag No cell itself is clickable to view the photo.
  // "malli chivara veiw option enduku, vardu remvoe chei" — the separate Photo/View-button column was
  // redundant once the Tag No click does the same thing, so it's removed; Tag No click is now the only
  // way to view the photo. "outlet isse items kuda chupinchu" — Outlet Issue rows (their dsrId is synced
  // via nextOutletIssueId_() as "OI"+6 digits, distinct from a normal DSR ID) get a visible Type badge so
  // they don't blend in with regular Sale rows.
  SOLD_ROWS_RENDERED = rows;
  let html = `<table class="ov-table"><thead><tr><th>Date</th><th>Tag No</th><th>Product</th><th>Design</th><th>Counter</th><th>Weight (gm)</th><th>Size</th><th>Type</th><th>Employee</th></tr></thead><tbody>`;
  rows.forEach((r, i) => {
    const kind = productKind(r.productName);
    const size = kind === 'chain' ? fmtSize(r.length) : kind === 'bangle' ? fmtSize(r.bangleSize) : kind === 'ring' ? fmtSize(r.ringSize) : '';
    const isOutlet = /^OI\d{6}$/.test(String(r.dsrId || ''));
    const typeBadge = isOutlet
      ? `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#fff3cd;color:#8a5a00;border:1px solid #e0b34d;">Outlet Issue</span>`
      : `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e6f4ea;color:#146c2e;border:1px solid #8fcea8;">Sale</span>`;
    const tagCell = r.photo
      ? `<a href="javascript:void(0)" onclick="viewSoldPhoto(${i})" style="color:var(--purple-mid);text-decoration:underline;font-weight:700;cursor:pointer;">${escHtml(r.tagNo || '—')}</a>`
      : escHtml(r.tagNo || '—');
    html += `<tr><td>${fmtDMY(r.soldDate)}</td><td>${tagCell}</td><td>${escHtml(properCase(r.productName))}</td><td>${escHtml(properCase(r.design) || '—')}</td><td>${escHtml(r.counter || '—')}</td><td style="text-align:right;">${fmtWt(r.weight) || '—'}</td><td>${escHtml(size || '—')}</td><td>${typeBadge}</td><td>${escHtml(properCase(r.soldBy) || '—')}</td></tr>`;
  });
  html += '</tbody></table>';
  body.innerHTML = html;
}
let SOLD_ROWS_RENDERED = [];
async function viewSoldPhoto(idx) {
  const r = SOLD_ROWS_RENDERED[idx]; if (!r || !r.photo) return;
  const old = document.getElementById('soldPhotoModal'); if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'soldPhotoModal';
  div.className = 'overlay';
  div.innerHTML = `<div class="stage-box" style="max-width:520px;max-height:80vh;">
      <button class="close-x" onclick="document.getElementById('soldPhotoModal').remove()">✕</button>
      <div class="stage" style="height:70vh;"><img id="soldPhotoImg" src="" alt="Loading..." style="width:100%;height:100%;object-fit:contain;"></div>
    </div>`;
  document.body.appendChild(div);
  div.addEventListener('click', e => { if (e.target === div) div.remove(); });
  const src = await resolveImgSrc(r.photo);
  const img = document.getElementById('soldPhotoImg');
  if (!img) return;
  if (src) img.src = src; else img.alt = '📷 Not downloaded yet — connect once to view this photo offline';
}
setSoldMode('today'); // sets the initial button colors before any tab is even opened

populateWtRangeOptions(); // fixed 0–100 list, doesn't need any data loaded first
initApp();

// v-add (BRO: "every 5 mins ki sync backend lo run avali... 5 mins ki run ainapudu reload ani
// chupinchakudadu, running page reload avakunda, automatic ga backend ki avali" — the header Sync
// button above is manual/on-tap; this is the same fetch running automatically every 5 minutes in the
// BACKGROUND, completely silently — it never calls reloadCurrentTab() (no "Loading..." wipe, no
// spinner, no banner), it just quietly re-fetches Photos + Overview + Sold from the backend and lets
// refreshSnapshot()/refreshOverviewSnapshots() drop the fresh data straight into whatever is already
// on screen, exactly like they already do for the very first load — so open pages just keep drifting
// up to date on their own, with no visible interruption at all.
setInterval(() => {
  if (!navigator.onLine || HEADER_SYNC_RUNNING) return;   // don't collide with a manual Sync tap
  Promise.all([refreshSnapshot(), refreshOverviewSnapshots()]).catch(() => {});
}, 5 * 60 * 1000);

// v-add (BRO: "file open chesinapudu refresh data ravadam ledu, sync click chestene vastundi. file
// open chesina ventane... auto sync avali" — on mobile, re-opening this file (switching back from
// another app/tab, or re-tapping a home-screen shortcut) usually does NOT re-run the page's JS at
// all: the browser just restores the page exactly as it was left (bfcache), so initApp() above never
// fires again and the screen keeps showing whatever was last loaded — only a real reload (the header
// Sync button, or a hard pull-to-refresh drag that forces the browser to reload) actually re-fetches.
// These two listeners catch both of those "came back to an already-open page" moments and run the
// same silent background sync as the 5-minute timer above — no "Loading..." wipe, no visible reload.
let LAST_AUTO_SYNC_TS = 0;
function silentAutoSyncIfDue() {
  if (!navigator.onLine || HEADER_SYNC_RUNNING) return;
  const now = Date.now();
  if (now - LAST_AUTO_SYNC_TS < 15000) return; // avoid double-firing (pageshow + visibilitychange together)
  LAST_AUTO_SYNC_TS = now;
  Promise.all([refreshSnapshot(), refreshOverviewSnapshots()]).catch(() => {});
}
// Fires on every page load AND on a bfcache restore (e.vent.persisted === true is the "was suspended,
// not truly reloaded" case — exactly the one that used to show stale data).
window.addEventListener('pageshow', () => { silentAutoSyncIfDue(); });
// Fires when the tab/app comes back to the foreground (covers switching apps on mobile and coming
// back, which doesn't always trigger 'pageshow').
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') silentAutoSyncIfDue();
});
</script>
</body>
</html>
